config_version = 15

[bar.default]
end = [
    "media",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "tray"
]
margin_ends = 0
radius = 0
scale = 0.90000000596046448
thickness = 25

[control_center]
width = 600

[dock]
auto_hide = true
background_opacity = 0.99999997764825821
concave_edge_corners = false
cross_axis_padding = 0
enabled = true
icon_size = 41
item_spacing = 0
launcher_position = "start"
magnification = false
magnification_scale = 1.7500000111758709
main_axis_padding = 0
pinned = [
    "org.mozilla.firefox",
    "com.discordapp.Discord",
    "Alacritty",
    "org.kde.kwrite",
    "libreoffice-writer",
    "com.obsproject.Studio",
    "org.gnome.Screenshot",
    "thunar"
]
reserve_space = false
show_dots = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 512.0
    cy = 586.0
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1024.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 718.4000244140625
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
avatar_path = "ASSET_AVATAR_PATH"
font_family = "Google Sans"
panel_anchor_bar = "default"

    [shell.animation]
    speed = 1.4000000208616257

    [shell.launcher]
    pinned = [ "com.discordapp.Discord", "libreoffice-writer", "org.kde.kwrite", "ai.storyteller.photocraft" ]

    [shell.panel]
    border_width = 0.0
    clipboard_position = "top_center"
    floating_offset = 5

    [shell.screenshot]
    directory = "/home/nerdrash/Pictures/Screenshots"

[theme]
builtin = "Rosé Pine"
community_palette = "Shinonome"
pure_black_dark = true
source = "community"

[wallpaper.default]
path = "ASSET_WALLPAPER_PATH"

[wallpaper.last]
path = "ASSET_WALLPAPER_PATH"

[wallpaper.monitors.eDP-1]
path = "ASSET_WALLPAPER_PATH"